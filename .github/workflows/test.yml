name: tests
on: [push, pull_request]
jobs:
  mercari-transformer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      USE_TF: '0'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'scipy==1.17.0' 'transformers==4.57.1' pytest pytest-cov
      - run: python -m pip install 'torch==2.9.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'sentence-transformers==5.2.0' 'lightgbm==4.7.0'
      - run: python -m pip install . --no-deps
      - name: Real tiny model training and full transformer statement coverage
        run: python -m pytest tests/test_mercari_transformer.py tests/test_mercari_final_torch.py tests/test_mercari_smalltext.py tests/test_mercari_text_cache.py --cov=benchmarks.mercari_text_cache --cov=benchmarks.mercari_smalltext --cov=benchmarks.mercari_transformer --cov=benchmarks.mercari_final_torch --cov-report=term-missing --cov-fail-under=100
  mercari-optimization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_CPP_MIN_LOG_LEVEL: '3'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[mercari,benchmark]' pytest pytest-cov
      - name: Verify the installed wheel includes its native library
        run: python -c 'import libtree; libtree._library()'
      - name: Full statement coverage with executable reference kernels
        run: >-
          NUMBA_DISABLE_JIT=1 python -m pytest
          tests/test_mercari.py tests/test_mercari_kernel.py tests/test_mercari_features.py
          tests/test_mercari_solver.py tests/test_mercari_fm.py tests/test_mercari_neural.py
          tests/test_mercari_advanced.py tests/test_mercari_sparse.py tests/test_mercari_inference.py
          tests/test_mercari_semantics.py tests/test_mercari_sequence.py tests/test_mercari_frontier.py
          tests/test_mercari_colab.py tests/test_mercari_ensemble.py tests/test_mercari_final.py
          tests/test_mercari_full_kernel.py
          tests/test_mercari_cpu.py tests/test_mercari_cpu_study.py
          tests/test_mercari_multiview.py tests/test_mercari_multiview_study.py
          tests/test_mercari_top3.py
          --cov=benchmarks.mercari --cov=benchmarks.mercari_kernel
          --cov=benchmarks.mercari_config --cov=benchmarks.mercari_features
          --cov=benchmarks.mercari_solver --cov=benchmarks.mercari_fm
          --cov=benchmarks.mercari_neural --cov=benchmarks.mercari_advanced
          --cov=benchmarks.mercari_sparse --cov=benchmarks.mercari_inference
          --cov=benchmarks.mercari_semantics --cov=benchmarks.mercari_frontier
          --cov=benchmarks.mercari_colab --cov=benchmarks.mercari_ensemble
          --cov=benchmarks.mercari_final --cov=benchmarks.mercari_full_kernel
          --cov=benchmarks.mercari_cpu --cov=benchmarks.mercari_cpu_study
          --cov=benchmarks.mercari_multiview --cov=benchmarks.mercari_multiview_study
          --cov=benchmarks.mercari_multiscale
          --cov=benchmarks.mercari_top3
          --junitxml=benchmarks/runs/ci/mercari-junit.xml
          --cov-report=json:benchmarks/runs/ci/mercari-coverage.json
          --cov-report=term-missing --cov-fail-under=100
      - name: Publish inspectable failure diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          def annotate(message):
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Mercari verification::' + escaped)
          junit = Path('benchmarks/runs/ci/mercari-junit.xml')
          if junit.exists():
              for case in ET.parse(junit).iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      annotate(case.get('classname', '') + '.' + case.get('name', '') + ': ' + (failure.text or '')[-2500:])
          coverage = Path('benchmarks/runs/ci/mercari-coverage.json')
          if coverage.exists():
              for name, result in json.loads(coverage.read_text())['files'].items():
                  missing = result['missing_lines']
                  if missing:
                      annotate(name + ': uncovered lines ' + ', '.join(map(str, missing[:30])))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercari-verification
          path: benchmarks/runs/ci/mercari-*
      - name: Compiled parallel FM arithmetic and learning
        run: python -m pytest tests/test_mercari_fm.py -q
  minimum-python-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . 'numpy==1.26.4' 'scikit-learn==1.4.2' 'shap==0.46.0' 'pytest>=8'
      - run: python -m pytest tests/test_integration.py
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,benchmark]'
      - run: make test
      - run: PYTHONPATH=python:. python -m pytest tests/test_benchmark.py
      - run: PYTHONPATH=python:. python -m pytest tests/test_mercari.py tests/test_mercari_kernel.py --cov=benchmarks.mercari --cov=benchmarks.mercari_kernel --cov-report=term-missing --cov-fail-under=100
      - run: make sanitize
      - run: make thread-sanitize
      - run: make coverage
      - run: clang-format --dry-run --Werror include/libtree/*.h src/*.cc src/*.h tests/*.cc examples/*.cc benchmarks/*.cc
      - run: PYTHONPATH=python python benchmarks/run.py --repeats 1 --output benchmarks/runs/ci-results.json
      - run: PYTHONPATH=python:. python benchmarks/c5.py --datasets breast_cancer wine --seeds 42 --threads 1 --repeats 1 --rounds 3 --output benchmarks/runs/c5-ci.json
      - run: PYTHONPATH=python:. python benchmarks/risk.py --datasets german_credit --seeds 42 --threads 1 --repeats 1 --rounds 3 --folds 2 --output benchmarks/runs/risk-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build-coverage/coverage*.html
