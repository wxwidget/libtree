name: tests
on: [push, pull_request]
jobs:
  mercari-optimization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_CPP_MIN_LOG_LEVEL: '3'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[mercari]' pytest pytest-cov
      - name: Verify the installed wheel includes its native library
        run: python -c 'import libtree; libtree._library()'
      - name: Full statement coverage with executable reference kernels
        run: >-
          NUMBA_DISABLE_JIT=1 python -m pytest
          tests/test_mercari.py tests/test_mercari_kernel.py tests/test_mercari_features.py
          tests/test_mercari_solver.py tests/test_mercari_fm.py tests/test_mercari_neural.py
          tests/test_mercari_advanced.py tests/test_mercari_sparse.py
          --cov=benchmarks.mercari --cov=benchmarks.mercari_kernel
          --cov=benchmarks.mercari_config --cov=benchmarks.mercari_features
          --cov=benchmarks.mercari_solver --cov=benchmarks.mercari_fm
          --cov=benchmarks.mercari_neural --cov=benchmarks.mercari_advanced
          --cov=benchmarks.mercari_sparse
          --cov-report=term-missing --cov-fail-under=100
      - name: Compiled parallel FM arithmetic and learning
        run: python -m pytest tests/test_mercari_fm.py -q
  minimum-python-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . 'numpy==1.26.4' 'scikit-learn==1.4.2' 'shap==0.46.0' 'pytest>=8'
      - run: python -m pytest tests/test_integration.py
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,benchmark]'
      - run: make test
      - run: PYTHONPATH=python:. python -m pytest tests/test_benchmark.py
      - run: PYTHONPATH=python:. python -m pytest tests/test_mercari.py tests/test_mercari_kernel.py --cov=benchmarks.mercari --cov=benchmarks.mercari_kernel --cov-report=term-missing --cov-fail-under=100
      - run: make sanitize
      - run: make thread-sanitize
      - run: make coverage
      - run: clang-format --dry-run --Werror include/libtree/*.h src/*.cc src/*.h tests/*.cc examples/*.cc benchmarks/*.cc
      - run: PYTHONPATH=python python benchmarks/run.py --repeats 1 --output benchmarks/runs/ci-results.json
      - run: PYTHONPATH=python:. python benchmarks/c5.py --datasets breast_cancer wine --seeds 42 --threads 1 --repeats 1 --rounds 3 --output benchmarks/runs/c5-ci.json
      - run: PYTHONPATH=python:. python benchmarks/risk.py --datasets german_credit --seeds 42 --threads 1 --repeats 1 --rounds 3 --folds 2 --output benchmarks/runs/risk-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build-coverage/coverage*.html
