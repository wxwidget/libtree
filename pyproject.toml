[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libtree-gbdt"
version = "0.2.0"
description = "Readable C++17 histogram gradient boosting with a NumPy interface"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "cmake>=3.16", "gcovr>=7", "clang-format>=18", "scikit-learn>=1.4", "shap>=0.46"]
sklearn = ["scikit-learn>=1.4"]
explain = ["shap>=0.46"]
benchmark = ["xgboost==3.4.1", "lightgbm==4.7.0", "scikit-learn>=1.4", "pandas>=2.0"]
mercari = ["pandas>=2.2", "scikit-learn>=1.4", "scipy>=1.12", "tensorflow-cpu==2.20.0", "numba==0.65.1"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
